<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crypto Bot Dashboard</title>
    <link rel="stylesheet" href="/static/dashboard.css" />
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; script-src 'self' https://code.jquery.com; img-src 'self' data:; connect-src 'self'"
    />
    <style>
      :root {
        --bg-dark: #0a0a0f;
        --bg-card: #12121a;
        --bg-card-hover: #1a1a24;
        --border: #2a2a3a;
        --text: #e4e4e7;
        --text-muted: #71717a;
        --accent: #22d3ee;
        --accent-glow: rgba(34, 211, 238, 0.15);
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --font-display: "Space Grotesk", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-display);
        background: var(--bg-dark);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.6;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
      }

      /* Header */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 0 40px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 32px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo-icon {
        width: 48px;
        height: 48px;
        background: linear-gradient(135deg, var(--accent) 0%, #06b6d4 100%);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        box-shadow: 0 0 30px var(--accent-glow);
      }

      .logo-text {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.5px;
      }

      .header-actions {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .btn {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        font-family: var(--font-display);
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-ghost {
        background: transparent;
        color: var(--text-muted);
        border: 1px solid var(--border);
      }

      .btn-ghost:hover {
        background: var(--bg-card);
        color: var(--text);
        border-color: var(--text-muted);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--accent) 0%, #06b6d4 100%);
        color: var(--bg-dark);
      }

      .btn-primary:hover {
        box-shadow: 0 0 20px var(--accent-glow);
        transform: translateY(-1px);
      }

      .status-live {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--success);
        font-size: 14px;
        font-weight: 500;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        background: var(--success);
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
        }
        50% {
          opacity: 0.8;
          box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
        }
      }

      /* Stats Grid */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
      }

      .stat-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        transition: all 0.3s ease;
      }

      .stat-card:hover {
        background: var(--bg-card-hover);
        transform: translateY(-2px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      .stat-label {
        font-size: 13px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
      }

      .stat-value {
        font-size: 28px;
        font-weight: 700;
        font-family: var(--font-mono);
        letter-spacing: -1px;
      }

      .stat-value.positive {
        color: var(--success);
      }
      .stat-value.negative {
        color: var(--danger);
      }

      /* Main Grid */
      .main-grid {
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 24px;
      }

      @media (max-width: 1024px) {
        .main-grid {
          grid-template-columns: 1fr;
        }
      }

      /* Panel */
      .panel {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
      }

      .panel-title {
        font-size: 16px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .panel-body {
        padding: 24px;
      }

      /* Positions Table */
      .positions-table {
        width: 100%;
        border-collapse: collapse;
      }

      .positions-table th,
      .positions-table td {
        padding: 14px 16px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }

      .positions-table th {
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .positions-table td {
        font-family: var(--font-mono);
        font-size: 14px;
      }

      .positions-table tr:last-child td {
        border-bottom: none;
      }

      .positions-table tr:hover td {
        background: var(--bg-card-hover);
      }

      .side-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .side-badge.long {
        background: rgba(16, 185, 129, 0.15);
        color: var(--success);
      }

      .side-badge.short {
        background: rgba(239, 68, 68, 0.15);
        color: var(--danger);
      }

      /* Activity List */
      .activity-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 400px;
        overflow-y: auto;
      }

      .activity-item {
        display: flex;
        gap: 12px;
        padding: 12px;
        background: var(--bg-dark);
        border-radius: 10px;
        transition: background 0.2s;
      }

      .activity-item:hover {
        background: var(--bg-card-hover);
      }

      .activity-icon {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
      }

      .activity-icon.decision {
        background: rgba(34, 211, 238, 0.15);
      }
      .activity-icon.action {
        background: rgba(16, 185, 129, 0.15);
      }
      .activity-icon.review {
        background: rgba(245, 158, 11, 0.15);
      }
      .activity-icon.error {
        background: rgba(239, 68, 68, 0.15);
      }

      .activity-content {
        flex: 1;
        min-width: 0;
      }

      .activity-title {
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .activity-meta {
        font-size: 12px;
        color: var(--text-muted);
      }

      /* Empty State */
      .empty-state {
        text-align: center;
        padding: 48px 24px;
        color: var(--text-muted);
      }

      .empty-state-icon {
        font-size: 48px;
        margin-bottom: 16px;
        opacity: 0.5;
      }

      /* Loading */
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--text-muted);
        padding: 32px;
      }

      .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: var(--bg-dark);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      /* Footer */
      .footer {
        text-align: center;
        padding: 32px 0;
        color: var(--text-muted);
        font-size: 13px;
        border-top: 1px solid var(--border);
        margin-top: 48px;
      }

      .footer a {
        color: var(--accent);
        text-decoration: none;
      }

      /* Agent Analysis Modal */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(4px);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .modal-backdrop[hidden] {
        display: none;
      }

      .modal {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        max-width: 900px;
        width: 100%;
        max-height: 85vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
      }

      .modal-header h3 {
        font-size: 18px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .modal-body {
        padding: 24px;
        overflow-y: auto;
        flex: 1;
      }

      .agent-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
      }

      .agent-tab {
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-muted);
        font-family: var(--font-display);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
      }

      .agent-tab:hover {
        background: var(--bg-card-hover);
        color: var(--text);
      }

      .agent-tab.active {
        background: var(--accent);
        color: var(--bg-dark);
        border-color: var(--accent);
      }

      .agent-content {
        display: none;
      }

      .agent-content.active {
        display: block;
      }

      .agent-card {
        background: var(--bg-dark);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
      }

      .agent-card-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }

      .agent-card-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }

      .agent-card-icon.indicator {
        background: rgba(34, 211, 238, 0.15);
      }
      .agent-card-icon.pattern {
        background: rgba(168, 85, 247, 0.15);
      }
      .agent-card-icon.trend {
        background: rgba(245, 158, 11, 0.15);
      }
      .agent-card-icon.decision {
        background: rgba(16, 185, 129, 0.15);
      }

      .agent-card-title {
        font-size: 16px;
        font-weight: 600;
      }

      .agent-field {
        margin-bottom: 12px;
      }

      .agent-field-label {
        font-size: 12px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }

      .agent-field-value {
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--text);
      }

      .agent-field-value.bullish {
        color: var(--success);
      }
      .agent-field-value.bearish {
        color: var(--danger);
      }
      .agent-field-value.neutral {
        color: var(--warning);
      }

      .agent-analysis {
        background: var(--bg-card);
        border-radius: 8px;
        padding: 16px;
        margin-top: 12px;
        line-height: 1.7;
      }

      .agent-analysis h1,
      .agent-analysis h2,
      .agent-analysis h3 {
        margin: 16px 0 8px;
        font-weight: 600;
      }

      .agent-analysis h1 {
        font-size: 18px;
      }
      .agent-analysis h2 {
        font-size: 16px;
      }
      .agent-analysis h3 {
        font-size: 14px;
      }

      .agent-analysis p {
        margin-bottom: 8px;
      }

      .agent-analysis ul,
      .agent-analysis ol {
        margin: 8px 0;
        padding-left: 24px;
      }

      .agent-analysis li {
        margin-bottom: 4px;
      }

      .agent-analysis code {
        background: var(--bg-dark);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: var(--font-mono);
        font-size: 13px;
      }

      .agent-analysis pre {
        background: var(--bg-dark);
        padding: 12px;
        border-radius: 8px;
        overflow-x: auto;
        margin: 12px 0;
      }

      .agent-analysis pre code {
        background: transparent;
        padding: 0;
      }

      .agent-analysis blockquote {
        border-left: 3px solid var(--accent);
        padding-left: 12px;
        margin: 12px 0;
        color: var(--text-muted);
      }

      .no-data {
        text-align: center;
        color: var(--text-muted);
        padding: 32px;
      }

      .activity-item {
        cursor: pointer;
      }
    </style>
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="logo">
          <div class="logo-icon">⚡</div>
          <span class="logo-text">CryptoBot</span>
        </div>
        <div class="header-actions">
          <div class="status-live">
            <span class="status-dot"></span>
            <span>실시간</span>
          </div>
          <button class="btn btn-ghost" data-action="refresh-all">
            🔄 새로고침
          </button>
          <a href="/admin" class="btn btn-primary"> 🔐 관리자 </a>
        </div>
      </header>

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
          <div class="stat-label">총 잔고</div>
          <div class="stat-value" id="stat-balance">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">미실현 손익</div>
          <div class="stat-value" id="stat-unrealized">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">오늘 거래</div>
          <div class="stat-value" id="stat-trades">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">승률</div>
          <div class="stat-value" id="stat-winrate">-</div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="main-grid">
        <!-- Positions -->
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">📊 활성 포지션</h2>
            <button class="btn btn-ghost" data-action="refresh-positions">
              새로고침
            </button>
          </div>
          <div class="panel-body" style="padding: 0">
            <div id="positions-container">
              <div class="loading">
                <div class="spinner"></div>
                <span>로딩 중...</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Recent Activity -->
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">📝 최근 활동</h2>
          </div>
          <div class="panel-body">
            <div class="activity-list" id="activity-list">
              <div class="loading">
                <div class="spinner"></div>
                <span>로딩 중...</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <p>
          CryptoBot Dashboard — <a href="/admin">관리자 페이지</a>에서 설정을
          변경할 수 있습니다.
        </p>
      </footer>
    </div>

    <!-- Agent Analysis Modal -->
    <div class="modal-backdrop" id="agent-modal" hidden>
      <div class="modal">
        <div class="modal-header">
          <h3>🤖 에이전트 분석 보고서</h3>
          <button class="btn btn-ghost" data-action="close-modal">닫기</button>
        </div>
        <div class="modal-body">
          <div class="agent-tabs" id="agent-tabs">
            <button class="agent-tab active" data-tab="indicator">
              📊 Indicator
            </button>
            <button class="agent-tab" data-tab="pattern">🔮 Pattern</button>
            <button class="agent-tab" data-tab="trend">📈 Trend</button>
            <button class="agent-tab" data-tab="decision">🎯 Decision</button>
          </div>
          <div id="agent-contents">
            <!-- Agent contents will be rendered here -->
          </div>
        </div>
      </div>
    </div>

    <script src="/static/index.js"></script>
  </body>
</html>
