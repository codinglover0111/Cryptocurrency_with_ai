<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crypto Bot Dashboard</title>
    <link rel="stylesheet" href="/static/dashboard.css" />
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    />
    <style>
      :root {
        --bg-dark: #0a0a0f;
        --bg-card: #12121a;
        --bg-card-hover: #1a1a24;
        --border: #2a2a3a;
        --text: #e4e4e7;
        --text-muted: #71717a;
        --accent: #22d3ee;
        --accent-glow: rgba(34, 211, 238, 0.15);
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --font-display: "Space Grotesk", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-display);
        background: var(--bg-dark);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.6;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
      }

      /* Header */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 0 40px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 32px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo-icon {
        width: 48px;
        height: 48px;
        background: linear-gradient(135deg, var(--accent) 0%, #06b6d4 100%);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        box-shadow: 0 0 30px var(--accent-glow);
      }

      .logo-text {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.5px;
      }

      .header-actions {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .btn {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        font-family: var(--font-display);
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-ghost {
        background: transparent;
        color: var(--text-muted);
        border: 1px solid var(--border);
      }

      .btn-ghost:hover {
        background: var(--bg-card);
        color: var(--text);
        border-color: var(--text-muted);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--accent) 0%, #06b6d4 100%);
        color: var(--bg-dark);
      }

      .btn-primary:hover {
        box-shadow: 0 0 20px var(--accent-glow);
        transform: translateY(-1px);
      }

      .status-live {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--success);
        font-size: 14px;
        font-weight: 500;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        background: var(--success);
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
        }
        50% {
          opacity: 0.8;
          box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
        }
      }

      /* Stats Grid */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
      }

      .stat-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        transition: all 0.3s ease;
      }

      .stat-card:hover {
        background: var(--bg-card-hover);
        transform: translateY(-2px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      .stat-label {
        font-size: 13px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
      }

      .stat-value {
        font-size: 28px;
        font-weight: 700;
        font-family: var(--font-mono);
        letter-spacing: -1px;
      }

      .stat-value.positive {
        color: var(--success);
      }
      .stat-value.negative {
        color: var(--danger);
      }

      /* Main Grid */
      .main-grid {
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 24px;
      }

      @media (max-width: 1024px) {
        .main-grid {
          grid-template-columns: 1fr;
        }
      }

      /* Panel */
      .panel {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
      }

      .panel-title {
        font-size: 16px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .panel-body {
        padding: 24px;
      }

      /* Positions Table */
      .positions-table {
        width: 100%;
        border-collapse: collapse;
      }

      .positions-table th,
      .positions-table td {
        padding: 14px 16px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }

      .positions-table th {
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .positions-table td {
        font-family: var(--font-mono);
        font-size: 14px;
      }

      .positions-table tr:last-child td {
        border-bottom: none;
      }

      .positions-table tr:hover td {
        background: var(--bg-card-hover);
      }

      .side-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .side-badge.long {
        background: rgba(16, 185, 129, 0.15);
        color: var(--success);
      }

      .side-badge.short {
        background: rgba(239, 68, 68, 0.15);
        color: var(--danger);
      }

      /* Activity List */
      .activity-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: 400px;
        overflow-y: auto;
      }

      .activity-item {
        display: flex;
        gap: 12px;
        padding: 12px;
        background: var(--bg-dark);
        border-radius: 10px;
        transition: background 0.2s;
      }

      .activity-item:hover {
        background: var(--bg-card-hover);
      }

      .activity-icon {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
      }

      .activity-icon.decision {
        background: rgba(34, 211, 238, 0.15);
      }
      .activity-icon.action {
        background: rgba(16, 185, 129, 0.15);
      }
      .activity-icon.review {
        background: rgba(245, 158, 11, 0.15);
      }
      .activity-icon.error {
        background: rgba(239, 68, 68, 0.15);
      }

      .activity-content {
        flex: 1;
        min-width: 0;
      }

      .activity-title {
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .activity-meta {
        font-size: 12px;
        color: var(--text-muted);
      }

      /* Empty State */
      .empty-state {
        text-align: center;
        padding: 48px 24px;
        color: var(--text-muted);
      }

      .empty-state-icon {
        font-size: 48px;
        margin-bottom: 16px;
        opacity: 0.5;
      }

      /* Loading */
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--text-muted);
        padding: 32px;
      }

      .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: var(--bg-dark);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      /* Footer */
      .footer {
        text-align: center;
        padding: 32px 0;
        color: var(--text-muted);
        font-size: 13px;
        border-top: 1px solid var(--border);
        margin-top: 48px;
      }

      .footer a {
        color: var(--accent);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="logo">
          <div class="logo-icon">⚡</div>
          <span class="logo-text">CryptoBot</span>
        </div>
        <div class="header-actions">
          <div class="status-live">
            <span class="status-dot"></span>
            <span>실시간</span>
          </div>
          <button class="btn btn-ghost" onclick="refreshAll()">
            🔄 새로고침
          </button>
          <a href="/admin" class="btn btn-primary"> 🔐 관리자 </a>
        </div>
      </header>

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
          <div class="stat-label">총 잔고</div>
          <div class="stat-value" id="stat-balance">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">미실현 손익</div>
          <div class="stat-value" id="stat-unrealized">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">오늘 거래</div>
          <div class="stat-value" id="stat-trades">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">승률</div>
          <div class="stat-value" id="stat-winrate">-</div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="main-grid">
        <!-- Positions -->
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">📊 활성 포지션</h2>
            <button class="btn btn-ghost" onclick="loadPositions()">
              새로고침
            </button>
          </div>
          <div class="panel-body" style="padding: 0">
            <div id="positions-container">
              <div class="loading">
                <div class="spinner"></div>
                <span>로딩 중...</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Recent Activity -->
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">📝 최근 활동</h2>
          </div>
          <div class="panel-body">
            <div class="activity-list" id="activity-list">
              <div class="loading">
                <div class="spinner"></div>
                <span>로딩 중...</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <p>
          CryptoBot Dashboard — <a href="/admin">관리자 페이지</a>에서 설정을
          변경할 수 있습니다.
        </p>
      </footer>
    </div>

    <script>
      // Format numbers
      function formatNumber(num, decimals = 2) {
        if (num === null || num === undefined || isNaN(num)) return "-";
        return new Intl.NumberFormat("en-US", {
          minimumFractionDigits: decimals,
          maximumFractionDigits: decimals,
        }).format(num);
      }

      function formatUSD(num) {
        if (num === null || num === undefined || isNaN(num)) return "-";
        return "$" + formatNumber(num);
      }

      function formatPercent(num) {
        if (num === null || num === undefined || isNaN(num)) return "-";
        const sign = num >= 0 ? "+" : "";
        return sign + formatNumber(num) + "%";
      }

      // Load status and balance
      async function loadStatus() {
        try {
          const res = await fetch("/status");
          const data = await res.json();

          if (data.balance) {
            const equity = parseFloat(
              data.balance.equity || data.balance.total || 0
            );
            document.getElementById("stat-balance").textContent =
              formatUSD(equity);

            const unrealized = parseFloat(data.balance.unrealized_pnl || 0);
            const unrealizedEl = document.getElementById("stat-unrealized");
            unrealizedEl.textContent = formatUSD(unrealized);
            unrealizedEl.className =
              "stat-value " + (unrealized >= 0 ? "positive" : "negative");
          }
        } catch (e) {
          console.error("Status load error:", e);
        }
      }

      // Load stats
      async function loadStats() {
        try {
          const res = await fetch("/stats");
          const data = await res.json();

          document.getElementById("stat-trades").textContent =
            data.total_trades || 0;

          const winrate = data.win_rate;
          if (winrate !== null && winrate !== undefined) {
            document.getElementById("stat-winrate").textContent =
              formatNumber(winrate) + "%";
          }
        } catch (e) {
          console.error("Stats load error:", e);
        }
      }

      // Load positions
      async function loadPositions() {
        const container = document.getElementById("positions-container");

        try {
          const res = await fetch("/api/positions_summary");
          const data = await res.json();
          const items = data.items || [];

          if (items.length === 0) {
            container.innerHTML = `
              <div class="empty-state">
                <div class="empty-state-icon">📭</div>
                <p>활성 포지션이 없습니다</p>
              </div>
            `;
            return;
          }

          let html = `
            <table class="positions-table">
              <thead>
                <tr>
                  <th>심볼</th>
                  <th>방향</th>
                  <th>진입가</th>
                  <th>현재가</th>
                  <th>손익</th>
                  <th>레버리지</th>
                </tr>
              </thead>
              <tbody>
          `;

          items.forEach((p) => {
            const side = (p.side || "").toLowerCase();
            const sideClass =
              side.includes("long") || side.includes("buy") ? "long" : "short";
            const sideLabel = sideClass === "long" ? "LONG" : "SHORT";

            const pnlClass = (p.pnl || 0) >= 0 ? "positive" : "negative";

            html += `
              <tr>
                <td>${p.symbol || "-"}</td>
                <td><span class="side-badge ${sideClass}">${sideLabel}</span></td>
                <td>${formatNumber(p.entryPrice, 4)}</td>
                <td>${formatNumber(p.lastPrice, 4)}</td>
                <td class="${pnlClass}">${formatUSD(p.pnl)} (${formatPercent(
              p.pnlPct
            )})</td>
                <td>${p.leverage || "-"}x</td>
              </tr>
            `;
          });

          html += "</tbody></table>";
          container.innerHTML = html;
        } catch (e) {
          console.error("Positions load error:", e);
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">⚠️</div>
              <p>포지션을 불러올 수 없습니다</p>
            </div>
          `;
        }
      }

      // Load recent activity
      async function loadActivity() {
        const container = document.getElementById("activity-list");

        try {
          const res = await fetch(
            "/api/journals_filtered?types=decision,action,review,error&limit=20&today_only=1"
          );
          const data = await res.json();
          const items = data.items || [];

          if (items.length === 0) {
            container.innerHTML = `
              <div class="empty-state">
                <div class="empty-state-icon">📝</div>
                <p>오늘의 활동이 없습니다</p>
              </div>
            `;
            return;
          }

          const icons = {
            decision: { icon: "🎯", class: "decision" },
            action: { icon: "⚡", class: "action" },
            review: { icon: "📋", class: "review" },
            error: { icon: "❌", class: "error" },
          };

          let html = "";
          items.slice(0, 15).forEach((item) => {
            const type = item.entry_type || "decision";
            const config = icons[type] || icons.decision;

            // Parse timestamp
            let timeStr = "-";
            if (item.ts) {
              const date = new Date(item.ts);
              timeStr = date.toLocaleTimeString("ko-KR", {
                hour: "2-digit",
                minute: "2-digit",
              });
            }

            // Truncate content
            let content = item.content || "";
            if (content.length > 60) content = content.substring(0, 60) + "...";

            html += `
              <div class="activity-item">
                <div class="activity-icon ${config.class}">${config.icon}</div>
                <div class="activity-content">
                  <div class="activity-title">${
                    item.symbol || "System"
                  } — ${content}</div>
                  <div class="activity-meta">${timeStr} · ${type}</div>
                </div>
              </div>
            `;
          });

          container.innerHTML = html;
        } catch (e) {
          console.error("Activity load error:", e);
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">⚠️</div>
              <p>활동을 불러올 수 없습니다</p>
            </div>
          `;
        }
      }

      // Refresh all data
      function refreshAll() {
        loadStatus();
        loadStats();
        loadPositions();
        loadActivity();
      }

      // Initial load
      document.addEventListener("DOMContentLoaded", () => {
        refreshAll();

        // Auto refresh every 30 seconds
        setInterval(refreshAll, 30000);
      });
    </script>
  </body>
</html>
